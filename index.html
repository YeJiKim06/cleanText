<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 워터마크 클리너</title>
    <style>
        body {
            font-family: 'Pretendard', -apple-system, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            margin: 0;
            color: #333;
        }
        .container {
            width: 100%;
            max-width: 900px;
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }
        h2 { text-align: center; color: #1a1a1a; margin-bottom: 30px; }

        .layout { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        
        label { font-weight: bold; margin-bottom: 8px; display: block; font-size: 14px; }
        textarea {
            width: 100%;
            height: 350px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
            resize: none;
            outline: none;
            background: #fff;
            line-height: 1.6;
        }
        textarea:focus { border-color: #ff4d4f; }

        /* 분석 리스트 */
        .analysis-panel {
            background: #fff1f0;
            border: 1px solid #ffa39e;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .analysis-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-size: 13px;
        }
        .count-val { font-weight: bold; color: #cf1322; }

        /* 버튼 레이아웃 */
        .btn-group { margin-top: 15px; display: flex; flex-wrap: wrap; gap: 10px; }
        button {
            flex: 1;
            min-width: 100px;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
            font-size: 13px;
        }
        .btn-danger { background: #ff4d4f; color: white; }
        .btn-danger:hover { background: #cf1322; }
        .btn-primary { background: #1890ff; color: white; }
        .btn-primary:hover { background: #096dd9; }
        .btn-secondary { background: #e8e8e8; color: #555; }
        .btn-secondary:hover { background: #d9d9d9; }
        .btn-outline { background: transparent; border: 1px solid #d9d9d9; color: #555; }
        .btn-outline:hover { background: #f5f5f5; border-color: #d9d9d9; }

        /* 결과 창 */
        .result-wrapper { position: relative; }
        .code-block {
            width: 100%;
            height: 350px;
            padding: 15px;
            background: #282c34;
            color: #abb2bf;
            border-radius: 8px;
            font-family: 'Consolas', monospace;
            font-size: 14px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
            box-sizing: border-box;
        }

        @media (max-width: 768px) {
            .layout { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🛡 AI 숨겨진 워터마크 클리너</h2>

    <div class="analysis-panel">
        <label style="color:#cf1322;">⚠ 검출된 보이지 않는 문자들</label>
        <div class="analysis-item"><span>제로 너비 문자 (U+200B~U+200F):</span> <span id="cnt-zw" class="count-val">0</span></div>
        <div class="analysis-item"><span>단어 결합자 (U+2060~U+2064):</span> <span id="cnt-wj" class="count-val">0</span></div>
        <div class="analysis-item"><span>변형 선택자 (U+FE00~U+FE0F):</span> <span id="cnt-vs" class="count-val">0</span></div>
        <div class="analysis-item"><span>양방향 텍스트 제어 (U+202A~U+202E):</span> <span id="cnt-bi" class="count-val">0</span></div>
        <div class="analysis-item"><span>결합 발음 구별 기호 (U+0300~U+036F):</span> <span id="cnt-di" class="count-val">0</span></div>
    </div>

    <div class="layout">
        <div>
            <label>텍스트 입력 (왼쪽)</label>
            <textarea id="input" placeholder="분석할 텍스트를 붙여넣으세요..."></textarea>
            <div class="btn-group">
                <button class="btn-danger" onclick="clean()">워터마크 제거 실행</button>
                <button class="btn-secondary" onclick="resetAll()">전체 초기화</button>
            </div>
        </div>
        <div>
            <label>클린 텍스트 (오른쪽 결과)</label>
            <div class="result-wrapper">
                <div id="output" class="code-block">대기 중...</div>
            </div>
            <div class="btn-group">
                <button class="btn-primary" onclick="copy()">결과 복사</button>
                <button class="btn-outline" onclick="clearRight()">오른쪽만 지우기</button>                
            </div>
        </div>
    </div>
    <div id="status" style="margin-top:20px; font-size:12px; color:#666; min-height: 18px; text-align: center;"></div>
</div>

<script>
    // 유니코드 정규식 정의
    const PATTERNS = {
        zw: /[\u200B-\u200F]/g,
        wj: /[\u2060-\u2064]/g,
        vs: /[\uFE00-\uFE0F]/g,
        bi: /[\u202A-\u202E]/g,
        di: /[\u0300-\u036F]/g
    };

    const input = document.getElementById('input');
    const output = document.getElementById('output');
    const status = document.getElementById('status');
    let toastTimeout = null;

    // 실시간 검출 감지
    input.addEventListener('input', () => {
        updateCounts();
    });

    function updateCounts() {
        const val = input.value;
        document.getElementById('cnt-zw').innerText = (val.match(PATTERNS.zw) || []).length;
        document.getElementById('cnt-wj').innerText = (val.match(PATTERNS.wj) || []).length;
        document.getElementById('cnt-vs').innerText = (val.match(PATTERNS.vs) || []).length;
        document.getElementById('cnt-bi').innerText = (val.match(PATTERNS.bi) || []).length;
        document.getElementById('cnt-di').innerText = (val.match(PATTERNS.di) || []).length;
    }

    function clean() {
        let text = input.value;
        if (!text) return;

        // 모든 특수 워터마크 문자 제거 (가시적 공백은 유지)
        let cleaned = text;
        Object.values(PATTERNS).forEach(regex => {
            cleaned = cleaned.replace(regex, '');
        });

        output.innerText = cleaned;
        showStatus("✅ 모든 보이지 않는 워터마크 문자가 제거되었습니다.", "#666");
    }

    // 왼쪽 내용만 지우기
    function clearLeft() {
        input.value = '';
        updateCounts();
        showStatus("🧹 왼쪽 입력 창이 비워졌습니다.", "#666");
    }

    // 오른쪽 내용만 지우기
    function clearRight() {
        output.innerText = '대기 중...';
        showStatus("🧹 오른쪽 결과 창이 비워졌습니다.", "#666");
    }

    // 전체 초기화 (기존 reset 함수 확장)
    function resetAll() {
        input.value = '';
        output.innerText = '대기 중...';
        status.innerText = '';
        document.querySelectorAll('.count-val').forEach(el => el.innerText = '0');
        if (toastTimeout) clearTimeout(toastTimeout);
    }

    function copy() {
        const text = output.innerText;
        if (text === '대기 중...') return;
        
        navigator.clipboard.writeText(text).then(() => {
            if (toastTimeout) clearTimeout(toastTimeout);

            showStatus("📋 정제된 텍스트가 클립보드에 복사되었습니다!", "#52c41a");

            toastTimeout = setTimeout(() => {
                if (input.value && output.innerText !== '대기 중...') {
                    showStatus("✅ 모든 보이지 않는 워터마크 문자가 제거되었습니다.", "#666");
                } else {
                    status.innerText = "";
                }
            }, 2500);
        });
    }

    function showStatus(message, color) {
        status.innerText = message;
        status.style.color = color;
    }
</script>

</body>
</html>
